server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — o sistema usa BrowserRouter (react-router), então dar F5 ou
    # abrir um link direto pra /almoco, /cadastro etc. precisa cair no
    # index.html e deixar o React cuidar da rota, senão vira 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
